<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit Complaint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <span class="brand">Complaint Management System</span>
    <a href="index.html">Submit Complaint</a>
    <a href="track.html">Track Complaint</a>
    <a href="admin.html">Admin</a>
  </nav>

  <div class="container">
    <h2>Submit a Complaint</h2>
    <form id="complaintForm">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required maxlength="100">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required maxlength="150">

      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="">-- Select --</option>
        <option>Service</option>
        <option>Billing</option>
        <option>Product</option>
        <option>Staff Behaviour</option>
        <option>Other</option>
      </select>

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" required maxlength="200">

      <label for="description">Description</label>
      <textarea id="description" name="description" required></textarea>

      <button type="submit">Submit Complaint</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    const form = document.getElementById('complaintForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = new URLSearchParams(new FormData(form));
      try {
        const res = await fetch('/api/complaints/submit', { method: 'POST', body });
        const data = await res.json();
        if (res.ok) {
          msg.className = 'msg ok';
          msg.textContent = 'Complaint submitted! Your Complaint ID is #' + data.id + ' (use it on the Track page).';
          form.reset();
        } else {
          msg.className = 'msg err';
          msg.textContent = data.error || 'Something went wrong';
        }
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = 'Network error: ' + err.message;
      }
    });
  </script>
</body>
</html>
